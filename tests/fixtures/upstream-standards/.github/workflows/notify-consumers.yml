# Tell every repository that inherits this one that it moved.
#
# The signal carries nothing. Each consumer resolves its own `inherits:` against the repositories it
# already trusts and decides for itself whether it has anything to do — a consumer tracking `@v3`
# receives this, resolves to the commit it already has, and exits. That is why one dispatch serves a
# canary on `@main` and a fleet on tags without segmenting the list.
#
# Nothing fires until this repository's own checks pass on main. A standard that breaks its own build
# should not reach two hundred repositories before anybody notices.
name: notify-consumers

on:
  workflow_run:
    workflows: [pipeline-ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  dispatch:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Mint a token for the consuming repositories
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Dispatch to every repository this App is installed on
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          # The App's installation list *is* the consumer list. Keeping a second one in a file here
          # would mean a repository that uninstalled still got poked, and a new one did not.
          gh api /installation/repositories --paginate --jq '.repositories[].full_name' \
            | while read -r repo; do
                gh api -X POST "repos/${repo}/dispatches" \
                  -f event_type=upstream-moved \
                  && echo "notified ${repo}" \
                  || echo "::warning::could not notify ${repo}"
              done
