spec: 1
name: acme-web

inherits:
  standards: ../upstream-standards
  review: ../upstream-review

commands:
  update:
    from: standards/update
  # This repository's own: nothing about it is inherited, and it still compiles under the
  # organization's sealed ceilings.
  changelog: {}
  review:
    from: review
    add-guardrails: [house-style]
    agents:
      reviewer:
        max-ai-credits: 150
        model: claude-opus-4-1

capabilities:
  actions: github.com/acme/pipeline-actions@v1.4.0
  exec: in-lockstep-exec==0.1.0
  exec-image: quay.io/acme/pipeline-exec
  compiler: in-lockstep>=0.1,<1.0
  gh-aw: v0.86.2

targets:
  github-agentic:
    out: .github/workflows
    profiles: [repo]

budgets:
  per_run_ai_credits: 200
