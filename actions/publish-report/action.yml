name: Publish report
description: >-
  Commit a run's report onto a long-lived branch, so it outlives the artifact it was built from.

  Artifacts expire; a dashboard nobody can open in three months cannot show a trend. The branch holds
  one directory per run plus a regenerated index, and carries no source — it is an orphan branch, so
  a normal clone never pulls the report history down.

inputs:
  branch:
    description: Branch to publish onto.
    required: true
  source:
    description: Directory holding the rendered report.
    required: true
  path:
    description: Directory on the branch to publish under.
    required: false
    default: "runs"
  name:
    description: Name for this run's directory. Defaults to the run id.
    required: false
    default: ""
  retain:
    description: How many runs to keep. Older directories are pruned.
    required: false
    default: "90"

outputs:
  url:
    description: Where the published report can be read.
    value: ${{ steps.publish.outputs.url }}

runs:
  using: composite
  steps:
    - name: Publish
      id: publish
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        source='${{ inputs.source }}'
        branch='${{ inputs.branch }}'
        prefix='${{ inputs.path }}'
        retain='${{ inputs.retain }}'
        name='${{ inputs.name }}'
        [ -n "$name" ] || name="${GITHUB_RUN_ID}"

        if [ ! -d "$source" ] || [ -z "$(find "$source" -type f 2>/dev/null | head -1)" ]; then
          echo "no report to publish from $source"
          exit 0
        fi

        staging="$(mktemp -d)"
        cp -R "$source/." "$staging/"

        git config --global --add safe.directory "$PWD" || true
        remote="$(git remote get-url origin)"
        work="$(mktemp -d)"
        if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
          git clone --depth 1 --branch "$branch" --single-branch "$remote" "$work"
        else
          git clone --depth 1 "$remote" "$work"
          git -C "$work" checkout --orphan "$branch"
          git -C "$work" rm -rf . >/dev/null 2>&1 || true
        fi
        git -C "$work" config user.name "github-actions[bot]"
        git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        mkdir -p "$work/$prefix/$name"
        cp -R "$staging/." "$work/$prefix/$name/"

        # Report history is useful; unbounded report history is a liability.
        if [ "$retain" -gt 0 ]; then
          ls -1 "$work/$prefix" | sort -r | tail -n +$((retain + 1)) | while read -r stale; do
            [ -n "$stale" ] && rm -rf "${work:?}/$prefix/$stale"
          done
        fi

        {
          echo "# Run reports"
          echo
          echo "| Run | Report |"
          echo "|---|---|"
          ls -1 "$work/$prefix" | sort -r | while read -r entry; do
            [ -n "$entry" ] && echo "| $entry | [dashboard]($prefix/$entry/dashboard.html) |"
          done
        } > "$work/README.md"

        git -C "$work" add -A
        if git -C "$work" diff --cached --quiet; then
          echo "report is unchanged; nothing to publish"
        else
          git -C "$work" commit -q -m "report: run $name"
          git -C "$work" push -q origin "$branch"
          echo "published run $name to $branch"
        fi

        url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${branch}/${prefix}/${name}/dashboard.html"
        echo "url=$url" >> "$GITHUB_OUTPUT"
        echo "[report for run $name]($url)" >> "$GITHUB_STEP_SUMMARY"
