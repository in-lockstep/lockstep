name: Load state database
description: >-
  Restore the pipeline's SQLite state database. It travels between jobs as an artifact, which is
  last-writer-wins — safe within one job, lossy across parallel ones. The compiler enforces that
  scope, so by the time this runs there is exactly one writer.

inputs:
  path:
    description: Where the database lives in the workspace.
    required: true

runs:
  using: composite
  steps:
    - name: Prepare
      id: prepare
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "${{ inputs.path }}")"
        echo "name=state-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
        echo "dir=$(dirname "${{ inputs.path }}")" >> "$GITHUB_OUTPUT"

    - name: Download database
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
      continue-on-error: true          # the first job to use state creates it
      with:
        name: ${{ steps.prepare.outputs.name }}
        path: ${{ steps.prepare.outputs.dir }}

    - name: Report
      shell: bash
      run: |
        if [ -f "${{ inputs.path }}" ]; then
          echo "loaded state database ($(wc -c < "${{ inputs.path }}" | tr -d ' ') bytes)"
        else
          echo "no state database yet; it will be created by this job"
        fi
