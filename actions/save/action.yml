name: Save workspace
description: >-
  Publish this job's output tree so later jobs can restore it. Matrix legs publish their own slice as
  they finish, which is what lets an interrupted run resume instead of starting over.

inputs:
  paths:
    description: Paths to publish. Defaults to $OUTPUT_DIR.
    required: false
    default: ""
  retention-days:
    description: How long the slice is kept.
    required: false
    default: "7"

runs:
  using: composite
  steps:
    - name: Resolve slice
      id: slice
      shell: bash
      run: |
        set -euo pipefail
        root="${OUTPUT_DIR:-outputs}"
        paths="${{ inputs.paths }}"
        [ -n "$paths" ] || paths="$root"

        # Asked before the marker below exists, or the marker is the file it finds and no slice is
        # ever empty.
        if [ -z "$(find $paths -type f 2>/dev/null | head -1)" ]; then
          echo "empty=true" >> "$GITHUB_OUTPUT"
        else
          echo "empty=false" >> "$GITHUB_OUTPUT"
        fi

        # `upload-artifact` roots an artifact at the common ancestor of what it matched, and
        # `restore` always extracts into $OUTPUT_DIR. Those two agree only when the saved path *is*
        # the output directory. Save `outputs/change/src` and the artifact is rooted at
        # `outputs/change`, so `src/` comes back as `outputs/src/` and everything between is gone.
        #
        # That is how an `/implement` run put its whole implementation at `outputs/src`,
        # `outputs/tests` and `outputs/actions` while `outputs/change` — the tree the pull request
        # is built from — held nothing but PLAN.md. It did not fail. It would have proposed the plan
        # and dropped the change.
        #
        # A marker at the root of the output directory pins the common ancestor there, whatever else
        # is being saved and whatever rule the uploader applies to pick it.
        mkdir -p "$root"
        : > "$root/.slice"
        paths="$paths"$'\n'"$root/.slice"

        echo "paths<<EOF" >> "$GITHUB_OUTPUT"
        echo "$paths" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"
        # Artifact names must be unique within a run: two matrix legs uploading the same name is an
        # error, and the legs cannot know their own index portably.
        echo "name=ws-${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}-${RANDOM}${RANDOM}" >> "$GITHUB_OUTPUT"

    - name: Upload slice
      if: steps.slice.outputs.empty != 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: ${{ steps.slice.outputs.name }}
        path: ${{ steps.slice.outputs.paths }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ignore
