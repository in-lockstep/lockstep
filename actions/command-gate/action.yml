name: Authorize a chat-ops command
description: >-
  Decide whether a comment asked for this pipeline, and whether its author may ask.

  A comment trigger runs with the repository's token while anyone who can comment can fire it. Those
  two facts together are why this exists: reading the comment is parsing, but deciding who is allowed
  is an authorization check against the API, and it must happen before anything else runs.

inputs:
  command:
    description: The slash command to look for, e.g. /implement.
    required: true
  roles:
    description: Comma-separated repository permissions allowed to invoke it.
    required: false
    default: "admin,maintain,write"
  associations:
    description: >-
      Comma-separated author associations allowed to invoke it. Checked alongside the permission
      because on a public repository the permission API is not a trust signal — everybody can read a
      public repository — while the association distinguishes a maintainer from a passer-by. Add
      CONTRIBUTOR or NONE deliberately to open the command to outside contributors.
    required: false
    default: "OWNER,MEMBER,COLLABORATOR"
  arguments:
    description: Comma-separated argument names bare positionals map onto.
    required: false
    default: ""
  reaction:
    description: Reaction to leave on the comment so the author knows it was seen.
    required: false
    default: "eyes"

outputs:
  authorized:
    description: "'true' only when the comment matched and its author was permitted."
    value: ${{ steps.decide.outputs.authorized }}
  instruction:
    description: Free text the author wrote after the command.
    value: ${{ steps.parse.outputs.instruction }}
  association:
    description: The commenter's relationship to the repository, as GitHub reported it.
    value: ${{ steps.role.outputs.association }}
  pull_request:
    description: The pull request the comment was on, empty when it was on an issue.
    value: ${{ steps.decide.outputs.pull_request }}
  arguments:
    description: >-
      The parsed arguments as JSON. They arrive as one value because their names are declared per
      pipeline, and a composite action can only expose outputs it names statically.
    value: ${{ steps.parse.outputs.arguments }}
  positional:
    description: >-
      The bare words after the command, as a JSON array. `/review security intent` asks for two
      things and the count is not known until somebody types it, so these are a list rather than
      named arguments.
    value: ${{ steps.parse.outputs.positional }}

runs:
  using: composite
  steps:
    - name: Read the comment
      id: parse
      shell: bash
      run: |
        set -euo pipefail
        # Only a comment can carry an unauthorized request. Every other trigger — a dispatch, a
        # schedule, a repository event — already required repository access to configure, so there is
        # nothing here to parse and nothing to authorize. Keying on the payload rather than on a list
        # of event names means adding a trigger cannot silently disable the pipeline.
        if [ "$(jq -r 'has("comment")' "$GITHUB_EVENT_PATH")" != "true" ]; then
          echo "matched=true" >> "$GITHUB_OUTPUT"
          echo "dispatch=true" >> "$GITHUB_OUTPUT"
          echo "not a comment trigger (${GITHUB_EVENT_NAME}); nothing to authorize"
          exit 0
        fi
        echo "dispatch=false" >> "$GITHUB_OUTPUT"
        jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH" > /tmp/comment-body.txt
        pipeline-exec parse-command \
          --command='${{ inputs.command }}' \
          --body-file=/tmp/comment-body.txt \
          --names='${{ inputs.arguments }}'

    - name: Check the author may ask
      id: role
      if: steps.parse.outputs.matched == 'true' && steps.parse.outputs.dispatch != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        actor="${GITHUB_ACTOR}"

        # Two independent signals, both of which must pass.
        #
        # The permission API answers "what can this account do here". On a public repository it is a
        # weak signal: a passer-by can read it, so a `read` permission says nothing about trust.
        # The author association, which GitHub puts in the event payload, answers the question that
        # actually matters — is this person part of this project.
        permission=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${actor}/permission" \
                       --jq '.permission' 2>/dev/null || echo "none")
        association=$(jq -r '.comment.author_association // "NONE"' "$GITHUB_EVENT_PATH")

        by_permission=false
        IFS=',' read -ra roles <<< "${{ inputs.roles }}"
        for role in "${roles[@]}"; do
          [ "$(echo "$role" | xargs)" = "$permission" ] && by_permission=true
        done

        by_association=false
        IFS=',' read -ra associations <<< "${{ inputs.associations }}"
        for entry in "${associations[@]}"; do
          [ "$(echo "$entry" | xargs | tr '[:lower:]' '[:upper:]')" = "$association" ] && by_association=true
        done

        allowed=false
        [ "$by_permission" = "true" ] && [ "$by_association" = "true" ] && allowed=true

        echo "permission=$permission" >> "$GITHUB_OUTPUT"
        echo "association=$association" >> "$GITHUB_OUTPUT"
        echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
        if [ "$allowed" != "true" ]; then
          echo "::warning::${actor} (permission '${permission}', association '${association}') may not run ${{ inputs.command }}"
        fi

    - name: Decide
      id: decide
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        authorized=false
        if [ "${{ steps.parse.outputs.dispatch }}" = "true" ]; then
          authorized=true
        elif [ "${{ steps.parse.outputs.matched }}" = "true" ] && [ "${{ steps.role.outputs.allowed }}" = "true" ]; then
          authorized=true
        fi
        echo "authorized=$authorized" >> "$GITHUB_OUTPUT"

        pr=$(jq -r '.issue.pull_request.url // .pull_request.url // ""' "$GITHUB_EVENT_PATH" 2>/dev/null || echo "")
        number=""
        [ -n "$pr" ] && number=$(jq -r '.issue.number // .pull_request.number // ""' "$GITHUB_EVENT_PATH")
        echo "pull_request=$number" >> "$GITHUB_OUTPUT"

        if [ "$authorized" = "true" ] && [ "${{ steps.parse.outputs.dispatch }}" != "true" ]; then
          # Acknowledge the comment so the author knows it was picked up rather than ignored.
          comment=$(jq -r '.comment.id // ""' "$GITHUB_EVENT_PATH")
          [ -n "$comment" ] && gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${comment}/reactions" \
            -f content='${{ inputs.reaction }}' >/dev/null 2>&1 || true
        fi
        echo "authorized: $authorized"
