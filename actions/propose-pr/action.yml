name: Propose generated work
description: >-
  Open a pull request carrying artifacts an agent produced.

  This is what makes a generated pipeline cheap to run. An agent writes the tests once; a human
  reviews them once; from then on the committed tests execute deterministically for nothing. Without
  this the pipeline would pay a model to regenerate the same tests on every schedule.

  The branch is namespaced and the token is scoped to it, so the worst a poisoned generation can do
  is open a pull request somebody declines.

inputs:
  source:
    description: Directory holding what the agent produced.
    required: true
  destination:
    description: Where it belongs in the repository.
    required: true
  branch:
    description: Branch prefix to propose from.
    required: false
    default: "pipeline/generated"
  title:
    description: Pull request title.
    required: false
    default: "Generated pipeline artifacts"
  labels:
    description: Comma-separated labels.
    required: false
    default: "pipeline,generated"
  reuse-branch:
    description: >-
      Push to one stable branch and update the open pull request instead of opening another.

      For work that supersedes itself. Three upstream bumps in a week should leave one pull request
      showing the current state, not three showing a history nobody asked for — and a reviewer who
      already commented keeps their thread.
    required: false
    default: "false"
  issue-from:
    description: >-
      A JSON file whose `key` names the work item this change came from — `#412` on GitHub,
      `PLAT-412` on Jira.

      When set, the key is recorded as an `Issue:` trailer on the commit, and a commit that could
      not find one **fails** rather than landing without it. A change nobody can trace back to the
      work item that asked for it is the thing this prevents, and it is not worth preventing softly.

      Read from a file rather than passed as a string because the file is what the tracker answered.
      A run invoked with `412`, or with a URL, still records the canonical key.
    required: false
    default: ""
  base:
    description: >-
      Branch the pull request targets. Defaults to the branch the workflow ran on. Set it to publish
      somewhere else — a documentation or GitHub Pages branch, for instance, whose contents have
      nothing to do with the branch that generated them.
    required: false
    default: ""

outputs:
  pull-request:
    description: URL of the pull request, empty when there was nothing to propose.
    value: ${{ steps.propose.outputs.pull-request }}

runs:
  using: composite
  steps:
    - name: Propose
      id: propose
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        source='${{ inputs.source }}'
        destination='${{ inputs.destination }}'

        if [ ! -d "$source" ] || [ -z "$(find "$source" -type f 2>/dev/null | head -1)" ]; then
          echo "nothing was generated; no pull request to open"
          echo "pull-request=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        mkdir -p "$destination"
        cp -R "$source/." "$destination/"

        # This job runs in the executor container, as root, against a workspace the runner owns.
        # `actions/checkout` handles that with a temporary global `safe.directory` scoped to its own
        # git invocations, which a composite action's `run:` step does not inherit — so git's
        # discovery rejects the repository and every command here reports `fatal: not in a git
        # directory`. Nothing caught it for the life of the project: each earlier run exited above,
        # at "nothing was generated", so no git command in this action had ever executed on a runner.
        git config --global --add safe.directory "$(pwd)"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # Stage what was copied, not everything the run left lying around. `destination: .` is the
        # ordinary case — a pipeline proposing changes to the repository it ran in — and `git add -A .`
        # there also sees the output directory sitting in the workspace: the fetched issue, the plan,
        # the scan reports, and a second copy of the generated tree. Whether those reached the
        # proposal was decided by whether the repository happened to ignore `outputs/`, which is not
        # a thing a proposal's contents should depend on.
        stage() {
          for entry in "$source"/* "$source"/.[!.]*; do
            [ -e "$entry" ] || continue
            git add -A "$destination/$(basename "$entry")"
          done
        }
        stage

        if git diff --cached --quiet; then
          echo "generated output matches what is already committed; nothing to propose"
          echo "pull-request=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        base='${{ inputs.base }}'
        [ -n "$base" ] || base="${GITHUB_REF_NAME}"
        reuse='${{ inputs.reuse-branch }}'
        # An input that arrives empty means "not supplied" — the same reading `base` gets on the
        # line above. Actions applies a declared default only to an *absent* input, and the compiler
        # always passes this one, so a command whose `branch` parameter defaults to "" hands over
        # the empty string and the default declared at the top of this file never fires. Left alone
        # that built `-${GITHUB_RUN_ID}`, which git rejects as a branch name — at the last step of a
        # run that had already paid for every agent in the pipeline.
        prefix='${{ inputs.branch }}'
        [ -n "$prefix" ] || prefix="pipeline/generated"
        if [ "$reuse" = "true" ]; then
          branch="$prefix"
        else
          branch="$prefix-${GITHUB_RUN_ID}"
        fi

        if [ "$base" != "${GITHUB_REF_NAME}" ]; then
          # Publishing onto a different branch: the work must sit on top of *that* branch, or the
          # pull request would carry every difference between the two.
          git stash push -q -- "$destination" 2>/dev/null || true
          git fetch -q origin "$base" 2>/dev/null || true
          if git rev-parse --verify -q "origin/$base" >/dev/null; then
            git checkout -q -B "$branch" "origin/$base"
          else
            git checkout -q --orphan "$branch"
            git rm -rq --cached . 2>/dev/null || true
          fi
          git stash pop -q 2>/dev/null || true
          stage
        else
          git checkout -q -b "$branch"
        fi
        issue_from='${{ inputs.issue-from }}'
        trailer=""
        if [ -n "$issue_from" ]; then
          key=""
          [ -f "$issue_from" ] && key=$(jq -r '.key // ""' "$issue_from")
          if [ -z "$key" ]; then
            echo "::error::no work-item key in ${issue_from}; refusing to commit untraceable work" >&2
            exit 1
          fi
          # A git trailer: conventional, parseable, and scanned by both trackers — GitHub autolinks
          # `#412` anywhere in the message, and Jira's connector matches `ABC-123` the same way.
          #
          # Deliberately not a closing keyword. `Fixes #412` would close the issue the moment this
          # merges, and whether the work is done is a judgement for whoever reviewed it.
          trailer="Issue: ${key}"
        fi

        if [ -n "$trailer" ]; then
          git commit -q -m "${{ inputs.title }}" -m "$trailer"
        else
          git commit -q -m "${{ inputs.title }}"
        fi

        body="Generated by \`${GITHUB_WORKFLOW}\` run [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

        Review these before merging. Once merged they run deterministically and cost nothing."

        if [ "$reuse" = "true" ]; then
          # Force-push: the branch carries the current answer, not the history of answers.
          git push -qf origin "$branch"
          existing=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "${{ inputs.title }}" --body "$body" >/dev/null
            echo "pull-request=$existing" >> "$GITHUB_OUTPUT"
            echo "updated $existing"
            echo "[review the update]($existing)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
        else
          git push -q origin "$branch"
        fi

        url=$(gh pr create \
          --title "${{ inputs.title }}" \
          --body "$body" \
          --label "${{ inputs.labels }}" \
          --base "$base" \
          --head "$branch")

        echo "pull-request=$url" >> "$GITHUB_OUTPUT"
        echo "opened $url"
        echo "[review the generated artifacts]($url)" >> "$GITHUB_STEP_SUMMARY"
