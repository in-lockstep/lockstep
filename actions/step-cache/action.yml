name: Step cache probe
description: >-
  Decide whether a step's work can be skipped, by content rather than by timestamp.

  Two layers are consulted in order: a named artifact published by an earlier run, which survives the
  cache's eviction window, and then actions/cache. `force` skips the lookup but never the publish, so
  a forced refresh with unchanged inputs still lands — an immutable cache key alone would drop it.

inputs:
  step:
    description: The step id, as it appears in the spec.
    required: true
  key-prefix:
    description: Stable prefix identifying the pipeline, command, step and profile.
    required: true
  key-inputs:
    description: Newline-separated files whose contents decide the key.
    required: false
    default: ""
  key-extra:
    description: Runtime values that change behaviour without changing any file.
    required: false
    default: ""
  outputs:
    description: Newline-separated paths this step produces.
    required: true
  force:
    description: Re-run every step regardless of what is cached.
    required: false
    default: "false"
  force-steps:
    description: Comma-separated step ids to re-run.
    required: false
    default: ""

outputs:
  hit:
    description: "'true' when the outputs were restored and the step's work can be skipped."
    value: ${{ steps.probe.outputs.hit }}
  key:
    description: The computed content-addressed key.
    value: ${{ steps.key.outputs.key }}

runs:
  using: composite
  steps:
    - name: Compute key
      id: key
      shell: bash
      run: |
        set -euo pipefail
        pipeline-exec cache-key \
          --prefix='${{ inputs.key-prefix }}' \
          --inputs='${{ inputs.key-inputs }}' \
          --extra='${{ inputs.key-extra }}'

    - name: Decide whether this step is forced
      id: forced
      shell: bash
      run: |
        set -euo pipefail
        forced=false
        if [ "${{ inputs.force }}" = "true" ]; then
          forced=true
        else
          # `force_steps` targets one phase without invalidating the rest, mirroring the local
          # runtime's phase-targeted --force.
          IFS=',' read -ra wanted <<< "${{ inputs.force-steps }}"
          for name in "${wanted[@]}"; do
            [ "$(echo "$name" | xargs)" = "${{ inputs.step }}" ] && forced=true
          done
        fi
        echo "forced=$forced" >> "$GITHUB_OUTPUT"
        [ "$forced" = "true" ] && echo "step '${{ inputs.step }}' forced; not restoring" || true

    - name: Restore from the durable layer
      id: artifact
      if: steps.forced.outputs.forced != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        name="step-${{ steps.key.outputs.key }}"
        hit=false
        # Artifacts outlive the cache's eviction window, so this layer is consulted first. Needs
        # `actions: read`, which the compiler grants to jobs that probe the cache.
        id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=1" \
               --jq '.artifacts[] | select(.expired == false) | .id' 2>/dev/null | head -1 || true)
        if [ -n "$id" ]; then
          if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > /tmp/step-cache.zip 2>/dev/null; then
            unzip -qo /tmp/step-cache.zip -d . && hit=true
            echo "restored '${{ inputs.step }}' from artifact ${name}"
          fi
        fi
        echo "hit=$hit" >> "$GITHUB_OUTPUT"

    - name: Restore from the fast layer
      id: cache
      if: steps.forced.outputs.forced != 'true' && steps.artifact.outputs.hit != 'true'
      uses: actions/cache/restore@v4
      with:
        key: ${{ steps.key.outputs.key }}
        path: ${{ inputs.outputs }}

    - name: Verdict
      id: probe
      shell: bash
      run: |
        set -euo pipefail
        hit=false
        if [ "${{ steps.artifact.outputs.hit }}" = "true" ] || [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
          hit=true
        fi
        # A hit is only a hit if the outputs are actually present; a partial restore must re-run.
        if [ "$hit" = "true" ]; then
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if [ ! -e "$path" ]; then
              echo "cache reported a hit but '$path' is missing; re-running"
              hit=false
              break
            fi
          done <<< "${{ inputs.outputs }}"
        fi
        echo "hit=$hit" >> "$GITHUB_OUTPUT"
        echo "step '${{ inputs.step }}': $([ "$hit" = "true" ] && echo 'cached, skipping' || echo 'running')"
