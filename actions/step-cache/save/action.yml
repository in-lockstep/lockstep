name: Step cache publish
description: >-
  Publish a step's outputs to both cache layers. Runs only on a miss, so a cache hit never
  re-publishes what it just restored.

inputs:
  step:
    description: The step id, as it appears in the spec.
    required: true
  outputs:
    description: Newline-separated paths this step produced.
    required: true
  key:
    description: The key computed by the probe. Defaults to the probe's output.
    required: false
    default: ""
  retention-days:
    description: How long the durable layer keeps these outputs.
    required: false
    default: "90"

runs:
  using: composite
  steps:
    - name: Resolve key
      id: resolved
      shell: bash
      run: |
        set -euo pipefail
        key="${{ inputs.key }}"
        [ -n "$key" ] || key="${STEP_CACHE_KEY:-}"
        if [ -z "$key" ]; then
          echo "no cache key available; nothing to publish" >&2
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
        fi

    - name: Publish to the durable layer
      if: steps.resolved.outputs.skip != 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        # Artifacts are per-run, so a forced refresh with unchanged inputs publishes a newer copy
        # that the probe will prefer — which is what an immutable cache key cannot express.
        name: step-${{ steps.resolved.outputs.key }}
        path: ${{ inputs.outputs }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: true
        if-no-files-found: ignore

    - name: Publish to the fast layer
      if: steps.resolved.outputs.skip != 'true'
      continue-on-error: true          # a key that already exists is not an error here
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        key: ${{ steps.resolved.outputs.key }}
        path: ${{ inputs.outputs }}
