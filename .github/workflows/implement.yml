# `/implement` on an issue. Hand-written and permanent; nothing generates or checks it.
#
# THIS FILE CONTAINS NO LIFECYCLE LOGIC. What `/implement` actually does — read the issue, run the
# strategy, stage a change, open a pull request, say what happened on the thread — is
# `implement/from-ticket` and `implement/propose` in `lockstep.py`, where it is Python that can be
# read, tested and run on a laptop. `in-lockstep ls` prints both.
#
# What is here is what belongs to the CI system and cannot be expressed anywhere else: the trigger,
# the job split, and which credential each job holds. No amount of Python makes one process hold
# two different token scopes, and keeping a provider key out of the job that can write is the
# reason there are three jobs rather than one function.
#
# WHERE THIS FILE COMES FROM. An `issue_comment` event runs the workflow on the DEFAULT branch,
# never a contributor's. That is the same provenance property `lockstep.py` relies on, and it is
# what makes it safe for a comment to name a command: the comment selects one, it does not supply
# one.
#
# WHO MAY FIRE IT. Anyone who can see a repository can comment on it, so the comment is not the
# authorization. `gate` is, and it runs first and alone — an unauthorized comment costs one job
# that calls nothing.
#
# WHAT IS STILL UNTRUSTED. The gate authorizes the ASKER, not the issue. Anyone can file an issue,
# and a member typing `/implement` on a drive-by hands that body to a model holding write tools.
# The ticket stays UNTRUSTED_EXTERNAL, writes are staged, ChangeGuard checks them twice, and the
# result arrives as a pull request a person reads. The gate bounds who can spend money; it does not
# bound what the text says.
#
# WHAT BOUNDS THE SPEND. The actor gate, the per-issue concurrency group, and the ceiling
# `lockstep.py` declares — stated there rather than here, because `--budget` replaces the module's
# number instead of merging with it, and a literal in this file is a ceiling nobody edits. There is
# no per-day ceiling; docs/controls-crosswalk.md records that as a loss rather than a replacement.
name: implement

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  # Per issue, and NOT cancel-in-progress: cancelling a run that has already called a model throws
  # away something that was paid for, and a cancelled call may still be billed.
  group: implement-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gate:
    # `startsWith` rather than `contains`: `contains` would fire on any comment that MENTIONS
    # `/implement`, which includes every comment explaining why not to run it. There is no `trim`
    # in GitHub's expression language, so a leading space means nothing happens — the failure
    # worth having, since the other direction is a command fired by a comment that was not one.
    # A pull-request comment fires `issue_comment` too, and is deliberately NOT filtered out: a
    # reviewer decides another attempt is needed while reading the pull request, and sending them
    # elsewhere to say so is how a tool teaches people it is awkward. Which ticket the run is about
    # is resolved in Python (`ticket_for`) from the number passed through below — GitHub draws
    # issue and pull-request numbers from one sequence, so a number is one or the other and never
    # both. `concurrency` groups on that raw number, so a round asked for on the issue and one
    # asked for on the pull request can overlap; they cannot collide, because every run gets its
    # own branch.
    if: startsWith(github.event.comment.body, '/implement')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      actor: ${{ steps.check.outputs.actor }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          python-version: '3.11'
      - run: uv sync
      # CODEOWNERS comes from this checkout, which is the default branch. Reading it from anywhere
      # a contributor can write would let someone add themselves to the list that decides whether
      # they may add themselves.
      - id: check
        run: |
          uv run in-lockstep gate --actor "$ACTOR" --association "$ASSOCIATION"
          echo "actor=$ACTOR" >> "$GITHUB_OUTPUT"
        env:
          ACTOR: ${{ github.event.comment.user.login }}
          ASSOCIATION: ${{ github.event.comment.author_association }}


  implement:
    needs: gate
    runs-on: ubuntu-24.04
    # Longer than the session deadline the module declares (`deadline_seconds=1800`, 30 minutes),
    # and deliberately so. A job timeout does not run the remaining steps, so if GitHub wins that
    # race the history bundle and the artifact upload below never happen — the run that most needs
    # a record is exactly the one that loses it. The framework has to be the thing that stops
    # first. The margin covers what this step still does after the session ends: running the suite
    # against the staged change, and serializing the change set.
    timeout-minutes: 40
    permissions:
      contents: read
      # Read-only, and needed: the workflow resolves `TicketSource` to fetch the issue. The split
      # this file is built around is about WRITE access.
      issues: read
      # Also read-only, and also needed: the workflow reads what people said on the pull request
      # it opened last time, so a reviewer's objection is context the next attempt can act on.
      # This job still holds no write token — proposing is the next job, which holds no key.
      pull-requests: read
      # Workload identity federation: this job may mint a short-lived GitHub OIDC token, which
      # the framework exchanges at Anthropic for the run's credential — no long-lived provider
      # key in repository secrets. Granted to THIS job only: gate and propose call no model, and
      # an identity token in the job holding the write token would put both credentials in one
      # process, which is the co-residency the three-job split exists to prevent.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          python-version: '3.11'
      # With the provider extra: model SDKs are optional dependencies, so the job that calls a
      # model has to ask for one.
      - run: uv sync --extra anthropic
      - run: uv run in-lockstep doctor
        continue-on-error: true
      # The same command a developer runs, with `--approved-by` where they would type `--approve`.
      # That is the whole transition: the process does not change when a project moves from a
      # terminal to hosted triggers, only who the human is and how they were verified.
      # NO `--budget`, and its absence is the load-bearing part of this step.
      #
      # `run --budget` REPLACES what lockstep.py declares — it does not merge — because "somebody
      # typed a number" is somebody meaning it. That is right for a person at a terminal and wrong
      # here, where nobody is typing: a literal in this file outranked the module silently and
      # permanently, so the ceiling that bound every /implement was one nobody looked at while
      # raising the one they thought bound it. That is exactly what happened — `lockstep.budget`
      # went to $100, the run was refused at $25.17 against the 25.00 written here, and the number
      # in the diff and the number in force were different numbers.
      #
      # So this flow has one ceiling and it lives in `lockstep.py`, next to the turn and token
      # caps it has to stay coherent with. Chat-ops runs on a repository that by definition has a
      # lockstep.py; if it declares no budget, `UndeclaredBudget` refuses before the first call,
      # which is the correct outcome and not something a literal here should paper over.
      #
      # `lockstep.yml` still states one, and that is not an inconsistency: review is the workflow
      # an adopter gets before they have written a lockstep.py at all.
      - run: |
          uv run in-lockstep run implement/from-ticket \
            --arg ticket="#${ISSUE}" \
            --approved-by "${ACTOR}"
        env:
          ISSUE: ${{ github.event.issue.number }}
          # A name GitHub computed and the gate above verified, not one the comment claimed.
          ACTOR: ${{ needs.gate.outputs.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional once federation is configured: a static key set here still wins (an
          # explicitly set key is somebody meaning it), and its absence is what routes the
          # framework to the federation path below.
          #ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Workload identity federation. These four are identifiers, not secrets — putting one
          # in `secrets` would seed Redact with it and mask it out of the errors that name it.
          # The framework mints the GitHub JWT itself (with the audience the federation rule
          # expects) and hands it to the SDK's token exchange; no fetch step belongs in this
          # file, which contains no logic.
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_01YHsixNuafpyXLLRpHFMEsu
          ANTHROPIC_ORGANIZATION_ID: 8e678137-2908-4c6f-ab64-4e7839de1f0f
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01XV2Kosdrf72doqBts86VZj
          # A variable, not a secret: a workspace id identifies, it does not authenticate.
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          IN_LOCKSTEP_ORG_SPEND_LIMIT: ${{ vars.IN_LOCKSTEP_ORG_SPEND_LIMIT }}
      # The record this run made lives in THIS runner's `.git` and dies with it — the job that
      # can push is a different runner with a fresh checkout. So it travels as a bundle, the same
      # shape as the change set: the unprivileged job produces, the privileged one publishes, and
      # the credential split survives.
      - run: uv run in-lockstep history --bundle history.bundle
        if: always()
        continue-on-error: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: implement-${{ github.event.issue.number }}
          path: |
            changeset/
            history.bundle
          if-no-files-found: ignore

  propose:
    needs: [gate, implement]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # An environment, so this is where a human gate belongs if you want one before anything is
    # pushed. Adding required reviewers to it in repository settings makes it an approval in the
    # system of record, which is what ApprovalGate's design asks for and what the environment
    # variable above is honestly weaker than. With no protection rules it passes straight through,
    # and the pull request is the review.
    environment: implement
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          python-version: '3.11'
      # NOT `--extra anthropic`. This job holds a write token and must be unable to reach a model
      # at all; `implement/propose` never asks for one, and not installing the SDK makes that a
      # fact about the environment rather than a property of the code path taken.
      - run: uv sync
      # Outside the workspace, deliberately: downloaded into it, `changeset/` would be swept into
      # the commit `open_change` makes.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: implement-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/implement
      - run: |
          uv run in-lockstep run implement/propose \
            --arg ticket="#${ISSUE}" \
            --arg artifact="${RUNNER_TEMP}/implement/changeset"
        env:
          ISSUE: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Where the run record becomes durable. This job holds `contents: write` and no provider
      # credential, which is exactly the right half to publish evidence from.
      - run: |
          uv run in-lockstep history \
            --from-bundle "${RUNNER_TEMP}/implement/history.bundle" \
            --push
        if: always()
        continue-on-error: true

  # The answer a failed run would otherwise never give. `propose` is skipped by `needs:` when the
  # work job exits non-zero, and `implement/propose` is what comments on the ticket — so a strategy
  # refusing in its first phase left the person who asked watching a thread that never replied.
  # That is the one failure a chat-ops trigger cannot afford: the alternative to an answer is
  # somebody assuming it worked.
  #
  # Holds a write token and no provider key, exactly like `propose`, so the credential split is
  # unchanged. It says what happened and publishes the record; it opens nothing.
  report:
    needs: [gate, implement]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          python-version: '3.11'
      - run: uv sync
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: implement-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/implement
        continue-on-error: true
      # Absorbed first, so the comment below can read the record the failed run wrote rather than
      # being told what happened by this file.
      - run: |
          uv run in-lockstep history \
            --from-bundle "${RUNNER_TEMP}/implement/history.bundle" \
            --push
        continue-on-error: true
      - run: |
          uv run in-lockstep run implement/report \
            --arg ticket="#${ISSUE}"
        env:
          ISSUE: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
