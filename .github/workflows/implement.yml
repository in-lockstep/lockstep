# `/implement` on an issue. Hand-written and permanent; nothing generates or checks it.
#
# THIS FILE CONTAINS NO LIFECYCLE LOGIC. What `/implement` actually does — read the issue, run the
# strategy, stage a change, open a pull request, say what happened on the thread — is
# `implement/from-issue` and `implement/propose` in `lockstep.py`, where it is Python that can be
# read, tested and run on a laptop. `in-lockstep ls` prints both.
#
# What is here is what belongs to the CI system and cannot be expressed anywhere else: the trigger,
# the job split, and which credential each job holds. No amount of Python makes one process hold
# two different token scopes, and keeping a provider key out of the job that can write is the
# reason there are three jobs rather than one function.
#
# WHERE THIS FILE COMES FROM. An `issue_comment` event runs the workflow on the DEFAULT branch,
# never a contributor's. That is the same provenance property `lockstep.py` relies on, and it is
# what makes it safe for a comment to name a command: the comment selects one, it does not supply
# one.
#
# WHO MAY FIRE IT. Anyone who can see a repository can comment on it, so the comment is not the
# authorization. `gate` is, and it runs first and alone — an unauthorized comment costs one job
# that calls nothing.
#
# WHAT IS STILL UNTRUSTED. The gate authorizes the ASKER, not the issue. Anyone can file an issue,
# and a member typing `/implement` on a drive-by hands that body to a model holding write tools.
# The ticket stays UNTRUSTED_EXTERNAL, writes are staged, ChangeGuard checks them twice, and the
# result arrives as a pull request a person reads. The gate bounds who can spend money; it does not
# bound what the text says.
#
# WHAT BOUNDS THE SPEND. The actor gate, the per-issue concurrency group, and `--budget`. There is
# no per-day ceiling; docs/controls-crosswalk.md records that as a loss rather than a replacement.
name: implement

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  # Per issue, and NOT cancel-in-progress: cancelling a run that has already called a model throws
  # away something that was paid for, and a cancelled call may still be billed.
  group: implement-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gate:
    # `startsWith` rather than `contains`: `contains` would fire on any comment that MENTIONS
    # `/implement`, which includes every comment explaining why not to run it. There is no `trim`
    # in GitHub's expression language, so a leading space means nothing happens — the failure
    # worth having, since the other direction is a command fired by a comment that was not one.
    if: >-
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/implement')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      actor: ${{ steps.check.outputs.actor }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          python-version: '3.11'
      - run: uv sync
      # CODEOWNERS comes from this checkout, which is the default branch. Reading it from anywhere
      # a contributor can write would let someone add themselves to the list that decides whether
      # they may add themselves.
      - id: check
        run: |
          uv run in-lockstep gate --actor "$ACTOR" --association "$ASSOCIATION"
          echo "actor=$ACTOR" >> "$GITHUB_OUTPUT"
        env:
          ACTOR: ${{ github.event.comment.user.login }}
          ASSOCIATION: ${{ github.event.comment.author_association }}

  implement:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Read-only, and needed: the workflow resolves `TicketSource` to fetch the issue. The split
      # this file is built around is about WRITE access.
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          python-version: '3.11'
      # With the provider extra: model SDKs are optional dependencies, so the job that calls a
      # model has to ask for one.
      - run: uv sync --extra anthropic
      - run: uv run in-lockstep doctor
        continue-on-error: true
      # The same command a developer runs, with `--approved-by` where they would type `--approve`.
      # That is the whole transition: the process does not change when a project moves from a
      # terminal to hosted triggers, only who the human is and how they were verified.
      - run: |
          uv run in-lockstep run implement/from-issue \
            --arg issue="#${ISSUE}" \
            --approved-by "${ACTOR}" \
            --budget 2.00
        env:
          ISSUE: ${{ github.event.issue.number }}
          # A name GitHub computed and the gate above verified, not one the comment claimed.
          ACTOR: ${{ needs.gate.outputs.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # A variable, not a secret: a workspace id identifies, it does not authenticate, and
          # putting one in `secrets` would seed Redact with it and mask it out of the errors that
          # name it.
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          IN_LOCKSTEP_ORG_SPEND_LIMIT: ${{ vars.IN_LOCKSTEP_ORG_SPEND_LIMIT }}
      # The record this run made lives in THIS runner's `.git` and dies with it — the job that
      # can push is a different runner with a fresh checkout. So it travels as a bundle, the same
      # shape as the change set: the unprivileged job produces, the privileged one publishes, and
      # the credential split survives.
      - run: uv run in-lockstep history --bundle history.bundle
        if: always()
        continue-on-error: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: implement-${{ github.event.issue.number }}
          path: |
            changeset/
            history.bundle
          if-no-files-found: ignore

  propose:
    needs: [gate, implement]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # An environment, so this is where a human gate belongs if you want one before anything is
    # pushed. Adding required reviewers to it in repository settings makes it an approval in the
    # system of record, which is what ApprovalGate's design asks for and what the environment
    # variable above is honestly weaker than. With no protection rules it passes straight through,
    # and the pull request is the review.
    environment: implement
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          python-version: '3.11'
      # NOT `--extra anthropic`. This job holds a write token and must be unable to reach a model
      # at all; `implement/propose` never asks for one, and not installing the SDK makes that a
      # fact about the environment rather than a property of the code path taken.
      - run: uv sync
      # Outside the workspace, deliberately: downloaded into it, `changeset/` would be swept into
      # the commit `open_change` makes.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: implement-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/implement
      - run: |
          uv run in-lockstep run implement/propose \
            --arg issue="#${ISSUE}" \
            --arg artifact="${RUNNER_TEMP}/implement/changeset"
        env:
          ISSUE: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Where the run record becomes durable. This job holds `contents: write` and no provider
      # credential, which is exactly the right half to publish evidence from.
      - run: |
          uv run in-lockstep history \
            --from-bundle "${RUNNER_TEMP}/implement/history.bundle" \
            --push
        if: always()
        continue-on-error: true
