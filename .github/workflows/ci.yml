name: CI

# Hand-written and permanent. The gate that proves the framework works cannot be framework output,
# which is the same reason this file was hand-written when the repository shipped a compiler.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # `GATE-DOGFOOD-1` asks the host whether this framework has merged a change here. Read-only, and
  # the token reaches `gh` alone: nothing in `make ci` writes.
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Every branch, so `origin/lockstep-history` exists here and the dogfood gate reads the
          # ledger rather than skipping; a depth-1 checkout of the pull request has no such ref.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          python-version: '3.11'
      - run: uv sync
      - run: make ci
        env:
          GH_TOKEN: ${{ github.token }}

  # The same suite, in the container a model's run will meet.
  #
  # `check` above runs pytest on the runner. Every `/implement` and `/fix` runs it inside the
  # container `.lockstep/lockstep.py` binds to `Test`, and until this job existed nothing
  # exercised that second path without spending: the only thing that had ever noticed a failure
  # there was a paid run. #373 failed twice on one test that passes on the runner and in every
  # local rebuild of that container, and the second attempt cost $7.92 to learn what this says
  # for free on every push.
  #
  # It dispatches the shipped `selfcheck` workflow rather than a hand-rolled `docker run`, so the
  # image, the mounts and the environment are the ones the binding declares and cannot drift from
  # what a model's `run_tests` gets. No token and no credential: `gh` is not in the container, so
  # the gates that ask the host skip by name there, which is itself part of what this proves.
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          python-version: '3.11'
      - run: uv sync
      - run: uv run in-lockstep run selfcheck
