name: CI

# Hand-written and permanent. The gate that proves the framework works cannot be framework output,
# which is the same reason this file was hand-written when the repository shipped a compiler.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: uv sync
      - run: make ci
