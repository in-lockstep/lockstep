# Invokes the CLI. Contains no lifecycle logic, and nothing generates or checks it.
#
# Two jobs rather than one. The job that talks to a model holds the provider credential and only
# read access; the job that writes holds write access and no provider credential. A single job
# would put an API key and a write token in the same process — which is the arrangement the
# previous execution substrate specifically avoided, and the reason it is reproduced here.
#
# `run` is given the base ref because configuration is loaded from it. Loading lockstep.py from
# the ref under review would let a pull request supply the file defining the bindings, the policy
# and the path tiers that constrain reviewing it.
#
# $0.75, sized against a measurement rather than a guess — and RAISED from $0.25 after a real run
# showed what $0.25 was actually sized for. The old number was measured against a median diff whose
# context is a few thousand tokens. A large pull request fills the reviewer's 60k-token context
# budget, and the pre-flight projection bounds output by `max_tokens` rather than by an expected
# value, so a full context projects $0.2414 before a byte is sent. A ceiling at $0.25 therefore
# refused the runs most worth reviewing, while looking like it had been chosen for them.
#
# $0.75 is roughly three times the worst-case projection and four times the observed cost of a
# full-context review ($0.189 at ~600 output tokens). Far enough above normal that it never fires
# on a good run; close enough that a loop going wrong stops in cents.
#
# It WAS per lens, and this job ran four lenses as four runs under it; since Phase 5 the four
# are branches of one run (`review/all-lenses`) sharing ONE ceiling, so the number stated below
# is the four-lens number: $3.00, four times the per-lens figure above, which is roughly four
# times the worst-case projection and sixteen times the observed cost of one full-context lens.
# A joint ceiling is the point of the fan-out (`GATE-COST-6`): a branch that would cross it is
# refused before its call, whatever the other three have spent. `IN_LOCKSTEP_DAILY_LIMIT` is
# the control that bounds the day rather than the run, and it is not set here.
#
# `--budget` is stated here rather than left to lockstep.py, because of the adoption case.
# Configuration loads from the trusted ref — the base branch — so a repository's very first pull
# request, the one that ADDS lockstep.py, has no config to load and therefore no declared ceiling,
# and GATE-BUDGET-1 refuses the run. This file is itself base-ref content for a `pull_request`
# event, which is the same property that makes config-from-base safe, so a ceiling stated here is
# equally out of reach of the change under review.
name: lockstep

on:
  pull_request:

permissions:
  contents: read
  # Workload identity federation: the review job may mint a short-lived GitHub OIDC token, which
  # the framework exchanges at Anthropic for the run's credential — no long-lived provider key
  # in repository secrets. On a pull request from a FORK this permission is not granted by
  # GitHub regardless of what is written here, which is why the review step below runs for a
  # fork only when a static key exists.
  id-token: write

concurrency:
  group: lockstep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Plural, and that is the whole of the rename: this is the four lenses, and `review` was the job
  # id in two different workflows here -- so both emitted a check run of that name and branch
  # protection's required `review` context was satisfiable by either. They did not collide only
  # because an `issue_comment` workflow's check attaches to the default branch's SHA rather than
  # the pull request's. An accident is a poor thing for a required check to rest on.
  #
  # RENAMING THIS RETIRES A REQUIRED CONTEXT. A check run is named for the JOB, not the workflow, so
  # branch protection has to be updated in the same window or every pull request blocks on a check
  # that never arrives.
  reviews:
    runs-on: ubuntu-24.04
    # 65 like every model job here, since the check became a `run` of a workflow under the
    # module's own hour-long deadline: the host must not end the job before the framework can
    # write its record. Four one-turn lenses finish in minutes; the number is a ceiling.
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          # The token `actions/checkout` would otherwise leave in `.git/config` is one `git config`
          # away from a test the model staged into a linked worktree; this job pushes nothing (#308).
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          python-version: '3.11'
      # With the provider extra. Model SDKs are optional dependencies so that a bare install stays
      # small, which means the one job that actually calls a model has to ask for one — and this
      # file had drifted from the scaffold it ships, which gets this right with
      # `uvx --from 'in-lockstep[anthropic]'`.
      # `provision` FIRST, then the extra this job needs. `uv run` syncs the project itself, so
      # this one step both bootstraps the framework and runs the verb the README tells adopters
      # their work jobs run (#249) -- against this repository, rather than against the synthetic
      # fixture in release-python.yml that was the only place it had ever run.
      #
      # The order is the lesson, and it cost a red required check to learn. `provision` executes
      # whatever `.lockstep/lockstep.py` binds, and under review that module is read from the BASE
      # branch -- so this job cannot know what environment provision will leave behind, and must
      # not depend on one. A bare `uv sync --locked` there uninstalls `--extra anthropic`, which
      # is precisely what happened the first time the binding reached a real run: four lenses
      # failed with "the anthropic provider needs its optional dependency", and no branch could
      # fix it from itself, because the binding that broke it was already on main. Installing what
      # this job needs AFTER provision makes the job robust to the binding rather than coupled to
      # it -- which is the right relationship anyway, since the binding belongs to the repository
      # and the extra belongs to this job.
      - run: uv run in-lockstep provision
      - run: uv sync --extra anthropic
      # Not `continue-on-error`. Its verdict used to be discarded because it cried wolf: a job
      # token cannot read the branch-protection API, and every unreadable answer was reported as
      # a missing control, so `doctor` exited 1 on every run of this repository. That is fixed
      # where it was wrong (absent is not zero, DOC120 vs DOC121), which is what makes a binding
      # verdict defensible: an ERROR here now means a control this job actually looked at is
      # actually missing, and continuing past one is how the diagnostic becomes decoration.
      - name: Are the controls in place?
        run: uv run in-lockstep doctor
        env:
          IN_LOCKSTEP_ORG_SPEND_LIMIT: ${{ vars.IN_LOCKSTEP_ORG_SPEND_LIMIT }}
      - name: Review
        # A fork's pull request gets neither secrets nor an id-token, so there the review is
        # skipped rather than failed — a red check the contributor cannot fix teaches everyone
        # to ignore red. Same-repo pull requests always run: federation needs no secret.
        if: ${{ !github.event.pull_request.head.repo.fork }}
        # EVERY shipped lens, not only security. `review` is a required status check here, so
        # every pull request into this repository was already gated on a model reading the diff —
        # through one lens of four. `intent`, `performance` and `tests` had never run on a real
        # pull request in the repository that exists to dogfood them (#241), which made them
        # things we ask adopters to trust on our word. That is what O10 exists to refuse.
        #
        # The lenses are not listed here any more. `review/all-lenses` declares one branch per
        # lens the BOUND adapter declares, so a lens added to the framework is exercised the day
        # it lands rather than the day somebody remembers this file (`GATE-REVIEW-5` holds the
        # workflow to that); the decision about money is the ceiling below, which the four share.
        #
        # Findings do not fail this step, which is what makes four lenses defensible on a
        # REQUIRED check. `AiReview` emits them as non-blocking warnings, so a lens that finds
        # something still exits 0 and the step goes red only when a lens is genuinely refused or
        # errored — a budget ceiling, an egress refusal, a schema mismatch. Nothing here can turn
        # a note about performance into a merge block, which is how a team learns to ignore red.
        #
        # Every lens runs even after one fails, and the command exits with the worst status. That
        # loop used to be four shell statements here -- `status=0; for …; do … || status=$?; done;
        # exit $status` -- which is lifecycle logic in the one file nothing tests (#314). It is
        # `review`'s own loop after #314, and one fan-out since Phase 5: four branches at once,
        # one joint budget, one kill switch, the worst verdict the run's (GATE-CI-4: this file
        # names a workflow and nothing else).
        #
        # One tape for all four. A cassette is keyed on the whole composed prompt and each lens
        # composes a different one, so they accumulate into the same file rather than overwrite
        # each other — and one harvest at the end covers the lot.
        run: |
          uv run in-lockstep run review/all-lenses \
            --arg base="origin/${GITHUB_BASE_REF}" \
            --arg head="${GITHUB_SHA}" \
            --arg comments=review-comments \
            --budget 3.00 \
            --record \
            --cassette "${RUNNER_TEMP}/review.json"
        env:
          # Optional once federation is configured: a static key set here still wins, and its
          # absence routes the framework to federation.
          #ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Workload identity federation. Identifiers, not secrets — see lockstep-implement.yml. The
          # framework mints the GitHub JWT itself; no fetch step belongs in this file.
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_01YHsixNuafpyXLLRpHFMEsu
          ANTHROPIC_ORGANIZATION_ID: 8e678137-2908-4c6f-ab64-4e7839de1f0f
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01XV2Kosdrf72doqBts86VZj
          # A variable, not a secret: a workspace id is an identifier, and putting one in
          # `secrets` would seed Redact with it and mask it out of the errors that name it.
          # Empty when unset, which is correct — a key that is not identity-linked needs no
          # workspace and must not be handed an empty header.
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          # Deliberately NOT IN_LOCKSTEP_EGRESS=enforced. This repository's lockstep.py binds
          # `UnsandboxedEgress`, and a bound policy is resolved before `detect()` ever reads this
          # variable — so setting it here did nothing while reading as though a control were in
          # place. A line that looks like a control and is not is worse than its absence.
          IN_LOCKSTEP_ORG_SPEND_LIMIT: ${{ vars.IN_LOCKSTEP_ORG_SPEND_LIMIT }}
      # The tape itself never leaves the runner: `--cassette` above points at RUNNER_TEMP, which
      # the runner destroys, and no path below reaches it. What survives is the cases harvested
      # from it — a request that was really sent, with expectations derived from the answer that
      # really came back. Every review this repository pays for was being discarded.
      #
      # `continue-on-error` because harvest REFUSES rather than inventing: a recording it cannot
      # back a case from is a non-zero exit, and that is the right behaviour for harvest and the
      # wrong reason to fail a review somebody is waiting on.
      - name: Harvest what the review recorded
        if: ${{ !github.event.pull_request.head.repo.fork }}
        continue-on-error: true
        run: |
          uv run in-lockstep eval harvest \
            --from "${RUNNER_TEMP}/review.json" \
            --into .lockstep/cases \
            --family review
      # `review` is read-only and this job has `contents: read`, so it cannot publish its own
      # record. The bundle carries it out, and `publish` below pushes it to `lockstep-history`.
      - run: uv run in-lockstep history --bundle history.bundle
        if: always()
        continue-on-error: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: lockstep-run
          path: |
            history.bundle
            review-comments/
            .lockstep/
          if-no-files-found: ignore
          # `.lockstep/` is a dotted path, and upload-artifact@v4 excludes hidden files by
          # DEFAULT. This line was missing, so the directory named above was silently dropped
          # and the artifact carried the history bundle alone -- 1115 bytes, no cases, no
          # warning, and a `path:` that reads as though it were working.
          include-hidden-files: true
          # Stated rather than inherited. The vendor default is 90 days, which is a retention
          # policy nobody in this repository chose for prompts and diffs; N9 in docs/needs.md
          # asks how long a repository keeps them and this is half the answer. Deletion is
          # automatic here, so inaction deletes rather than accumulating.
          retention-days: 30

  # Where the run record becomes durable. `review` holds the provider credential and
  # `contents: read`, so its record can only leave as the bundle in the artifact above -- and for
  # two days of pull requests that is where every one of them stayed, on a 30-day clock, while
  # the branch `report` reads held eight paid runs (#294). This job holds `contents: write` and
  # no provider credential, which is exactly the half a record should be published from: the
  # split lockstep-implement.yml's `propose` job already uses, one more time.
  #
  # `always()`, because a review that blocked or errored is the run most worth a record of. Not
  # for a fork, whose token cannot push. `continue-on-error` on the publish, because a record that
  # could not be pushed must not turn the review's verdict red -- and what this job misses (a run
  # `cancel-in-progress` cancelled, a refused push) the scheduled `reconcile` workflow sweeps up,
  # while `report --scm` counts what is still outstanding.
  publish:
    needs: reviews
    if: ${{ always() && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # The comments below. Held here and not in `review`, for the reason lockstep-review.yml splits its
      # `post` job from its reviewer: the process that calls a model must not also hold a token
      # that writes to the repository, and a comment is a write.
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          python-version: '3.11'
      # NOT `--extra anthropic`: this job holds a write token and must be unable to reach a model.
      - run: uv sync
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: lockstep-run
          path: ${{ runner.temp }}/review
        continue-on-error: true
      - run: |
          uv run in-lockstep history \
            --from-bundle "${RUNNER_TEMP}/review/history.bundle" \
            --push
        continue-on-error: true
      # Each lens's verdict and findings, as its own sticky comment on the pull request. Until
      # #345 they were printed into this run's log and nowhere else, so the reader of a pull
      # request that four lenses had read saw a green check and nothing they said -- and a later
      # `/fix` on the ticket, which gathers what was said on the change request, gathered none of
      # it. One comment per lens rather than one wall, anchored by the marker inside each body,
      # so a re-review edits four comments in place. `continue-on-error`, like the push above: a
      # comment that could not be posted must not turn the review's verdict red.
      - run: |
          uv run in-lockstep comment \
            --pr "$PR" \
            --body-file "${RUNNER_TEMP}/review/review-comments"
        continue-on-error: true
        env:
          PR: ${{ github.event.pull_request.number }}
          # `gh` reads this; the adapter shells out to it rather than holding an API client.
          GH_TOKEN: ${{ github.token }}

  # This repository's own provision and checks, in the sandbox a model's run will meet.
  #
  # HERE rather than in `ci.yml`, and the reason is that file's own first line: the gate that
  # proves the framework works cannot be framework output. This job dispatches
  # `in-lockstep run selfcheck`, so a broken CLI turns it red for reasons that have nothing to
  # do with the code under test -- which is the coupling `ci.yml` is hand-written to avoid. It
  # is the framework acting on this repository, which is what this workflow is.
  #
  # `check` above runs `make ci` on the GitHub runner. Every `/implement` and `/fix` runs the
  # repository's verbs inside the workshop's container instead, and until this job existed nothing
  # exercised that second path without spending: the only thing that had ever noticed a failure
  # there was a paid run. #373 failed twice on one test that passes on the runner and in every
  # local rebuild of that container, and the second attempt cost $7.92 to learn what this says for
  # free on every push.
  #
  # It dispatches the shipped `selfcheck` workflow rather than a hand-rolled `docker run`, so the
  # image and the environment are the ones the module declares. Since #419 that means: a copy of
  # the working tree, the repository's own `Provision` run over it, and then `Validate` and `Test`
  # in the workshop's image -- the same image a model's `run_script` and staged suite get, which is
  # what stops the two drifting onto different interpreters. `selfcheck` is a person's path, so the
  # container is not there to contain anything; it is there so this job meets what a model meets.
  # No token and no credential: `gh` is not in the container, so the gates that ask the host skip
  # by name there, which is itself part of what this proves.
  sandbox:
    runs-on: ubuntu-24.04
    # Job-level, which REPLACES the workflow's rather than adding to it. `id-token: write` is
    # granted above so the review job can mint an OIDC token for the provider exchange, and
    # this job holding no credential is half of what it demonstrates -- inheriting that grant
    # would quietly weaken the thing being shown.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          python-version: '3.11'
      - run: uv sync
      # `provision` first, the way the work jobs run it: it builds the venv every later
      # `uv run in-lockstep ...` step uses, and `uv sync` alone leaves out the extras the
      # module's Provision installs -- a suite missing an optional SDK SKIPS the tests that
      # need it, so the job went green while the very failure it was built to catch was not
      # being run (12 tests, including the one #373 died on twice). It no longer has anything
      # to do with what the checks below run against: since #419 those get their own
      # environment, provisioned into a copy of the working tree inside the sandbox, and
      # nothing is mounted. Saying so beats leaving the older claim standing.
      - run: uv run in-lockstep provision
      # `ApprovalGate` is bound in this repository's module and gates on EXECUTES_CODE, which
      # `PytestTest` declares and means -- so dispatching Test needs a grant, and the gate's own
      # docstring says a command that passes none makes it unopenable rather than strict (#189).
      # Nobody is watching a push, so the grant is `--approved-by` and the name recorded is
      # whoever caused the run, the same spelling `lockstep-implement.yml` uses after its gate job. Never
      # `--approve`: that one claims a human is watching this run, and in CI that is a false
      # record rather than a convenience.
      - run: uv run in-lockstep run selfcheck --approved-by "${{ github.actor }}"
