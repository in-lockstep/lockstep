spec: 1
name: lockstep

# This repository compiles its own drift gate.
#
# Everything else here is a pipeline repository that installs a released compiler. This one *is* the
# compiler, which changes exactly one thing and it is the thing that matters: the output is a
# function of the spec **and** of `src/`. So `compiler` points at the checkout rather than at a
# release — a gate that installed the published `lockstep` would recompile a pull request's spec
# with the previous pull request's compiler and pass — and `watch` puts the compiler's own source on
# the trigger, because a change to the emitter is the change most worth recompiling.
#
# The other three are declared now because this repository grew a pipeline with steps. `/review`
# fetches a diff and works out what is still due through builtins, which is a job with a
# `container:` and composite actions around it — so the placeholders that made this impossible are
# the published `actions-v0.1.0` and `exec-v0.1.0`.

capabilities:
  compiler: "."
  actions: github.com/in-lockstep/lockstep/actions@actions-v0.1.0
  exec: in-lockstep-exec==0.1.0
  exec-image: ghcr.io/in-lockstep/pipeline-exec
  gh-aw: v0.86.2

# The framework reviewing its own pull requests with the pipeline it ships.
#
# Inherited rather than written, deliberately: a bespoke review pipeline here would be the one
# consumers cannot have, and its lenses would stop being the ones under eval. What this repository
# adds is the half a shipped pipeline is forbidden to carry — `contexts/codebase.md`, which is
# knowledge of a codebase the framework has never seen.
inherits:
  review: lockstep:review

# A full `/review` runs four lenses at their published defaults — 90 + 50 + 50 + 40 — so 300 is the
# run with every lens requested plus room for one being tuned up. Enforced by the substrate before a
# run starts, not measured afterwards.
#
# The daily ceiling is per agent and exists for the failure this cannot otherwise survive: a lens
# stuck in a retry loop, or a comment trigger that fires on its own output. Roughly five full days'
# worth of reviews for the most expensive lens, at the volume this repository actually sees.
budgets:
  per_run_ai_credits: 300
  per_agent_daily_ai_credits: 500

targets:
  github-agentic:
    out: .github/workflows
    default-runs-on: ubuntu-24.04
    profiles: [repo]
    watch:
      - src/**
      - pyproject.toml
      - uv.lock
