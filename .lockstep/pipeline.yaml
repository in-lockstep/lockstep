spec: 1
name: lockstep

# This repository compiles its own drift gate.
#
# Everything else here is a pipeline repository that installs a released compiler. This one *is* the
# compiler, which changes exactly one thing and it is the thing that matters: the output is a
# function of the spec **and** of `src/`. So `compiler` points at the checkout rather than at a
# release — a gate that installed the published `lockstep` would recompile a pull request's spec
# with the previous pull request's compiler and pass — and `watch` puts the compiler's own source on
# the trigger, because a change to the emitter is the change most worth recompiling.
#
# The other three are declared now because this repository grew a pipeline with steps. `/review`
# fetches a diff and works out what is still due through builtins, which is a job with a
# `container:` and composite actions around it — so the placeholders that made this impossible are
# the published `actions-v0.1.0` and `exec-v0.1.0`.

capabilities:
  compiler: "."
  actions: github.com/in-lockstep/lockstep/actions@actions-v0.1.4
  exec: in-lockstep-exec==0.1.0
  exec-image: ghcr.io/in-lockstep/pipeline-exec
  gh-aw: v0.86.2

# The framework reviewing its own pull requests with the pipeline it ships.
#
# Inherited rather than written, deliberately: a bespoke review pipeline here would be the one
# consumers cannot have, and its lenses would stop being the ones under eval. What this repository
# adds is the half a shipped pipeline is forbidden to carry — `contexts/codebase.md`, which is
# knowledge of a codebase the framework has never seen.
inherits:
  review: lockstep:review
  implement: lockstep:implement
  # Reads the ledger the other two write. Added once there was something in it: a retro against an
  # empty branch can only report `too few runs`, which is correct and useless, and the weekly
  # schedule would have been teaching everybody to ignore it before it ever had anything to say.
  retro: lockstep:retro

# Sized by the most expensive command rather than by the cheapest. `/review` is four lenses at
# their published defaults — 90 + 50 + 50 + 40 = 230 — and `/implement` is four agents summing to
# 340, so 400 covers the larger one with room for a single agent tuned up inside its band. `doctor`
# fails the build when a command's agents sum past this, which is a better place to find out than
# partway through a run that has already spent most of it.
#
# The daily ceiling is per agent and exists for the failure a per-run cap cannot survive: an agent
# stuck in a retry loop, or a comment trigger that fires on its own output.
budgets:
  per_run_ai_credits: 25000
  per_agent_daily_ai_credits: 500000

# One line per run, on a branch, because artifacts expire and job logs rotate. Turned on the day
# `/review` went live rather than the day something wanted to read it: a run that finishes before
# this exists leaves no record, and the comparison it would have joined is simply unavailable
# afterwards. The eval noise floor is measured across repeated runs of one prompt, so the ledger has
# to predate the first prompt change worth judging.
#
# No `otel:` yet. Credits are read from what gh-aw already measured; dollars need a rate table, and
# a run with none is reported as unpriced rather than as free — `priced_fraction` travels with the
# cost so a reader can tell those apart.
history:
  branch: pipeline-history

targets:
  github-agentic:
    out: .github/workflows
    default-runs-on: ubuntu-24.04
    profiles: [repo]
    watch:
      - src/**
      - pyproject.toml
      - uv.lock
