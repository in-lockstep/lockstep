[project]
name = "pipeline-exec"
version = "0.1.0"
description = "Deterministic executors for compiled pipeline workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
]

[project.scripts]
pipeline-exec = "pipeline_exec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_exec"]
