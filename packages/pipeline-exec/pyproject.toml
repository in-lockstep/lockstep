[project]
name = "pipeline-exec"
version = "0.1.0"
description = "Deterministic executors for compiled pipeline workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Browser tests need Playwright, which is large. API and CLI tests do not, so it is opt-in:
# `pip install pipeline-exec[browser]`, or use the exec container image which bakes it in.
browser = ["playwright>=1.44"]

[project.scripts]
pipeline-exec = "pipeline_exec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_exec"]

[tool.hatch.build.targets.wheel.force-include]
"src/pipeline_exec/reports/templates" = "pipeline_exec/reports/templates"
