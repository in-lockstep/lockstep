[project]
name = "in-lockstep-exec"
version = "0.1.0"
description = "Deterministic executors for compiled pipeline workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Browser tests need Playwright, which is large. API and CLI tests do not, so it is opt-in:
# `pip install in-lockstep-exec[browser]`, or use the exec container image which bakes it in.
browser = ["playwright>=1.44"]

[project.scripts]
pipeline-exec = "pipeline_exec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_exec"]

# No `force-include` for the report templates: they live inside the package directory, so hatchling
# already ships them, and naming them again added the same file to the archive twice — which is a
# hard build error, not a warning. This package did not build at all until that came out.
