[project]
name = "in-lockstep"
version = "0.1.0"
description = "An agentic SDLC framework for Python. Your lifecycle is executable code, not a manifest."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

# Model SDKs are extras, not runtime dependencies. A bare `pip install in-lockstep` must not
# drag pydantic-core, grpcio, google-auth and botocore into a job that calls one provider —
# cold start is what R1-DEVOPS-3 resolved and what an in-process model call threatens.
[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
bedrock = ["anthropic[bedrock]>=0.40"]
google = ["anthropic[vertex]>=0.40", "google-genai>=1.0"]
openai = ["openai>=1.40"]
all = ["anthropic[bedrock,vertex]>=0.40", "google-genai>=1.0", "openai>=1.40"]

[project.scripts]
in-lockstep = "in_lockstep.cli:main"

[project.urls]
Homepage = "https://github.com/in-lockstep/lockstep"
Repository = "https://github.com/in-lockstep/lockstep"
Documentation = "https://github.com/in-lockstep/lockstep#readme"
Issues = "https://github.com/in-lockstep/lockstep/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
    "pytest-cov>=7.1.0",
    "in-lockstep-exec",
]

# One repository, two distributions: `in-lockstep` (this) and `in-lockstep-exec`. The names carry
# the organization prefix because the bare ones belong to unrelated projects on PyPI.
#
# They used to be developed together because the compiler emitted `pipeline-exec` invocations as
# literal text, and a contract test parsed every one of them against the real CLI. That contract
# went with the compiler; `in-lockstep-exec` now stands alone and nothing in the framework imports
# it. See docs/needs.md and packages/pipeline-exec/README.md for where that leaves it.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
in-lockstep-exec = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/in_lockstep"]

# Prompts and eval cases are package data, not Python. This is the failure mode that never shows
# up in a source checkout and always shows up in a clean install.
[tool.hatch.build.targets.wheel.force-include]
"src/in_lockstep/prompts" = "in_lockstep/prompts"
"src/in_lockstep/evals" = "in_lockstep/evals"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Code extracted verbatim from pipeline-framework. It carries resilience behaviour earned against a
# real application, so cosmetic rules do not apply to it and — more importantly — `make fmt` must
# never silently rewrite it. Changes here should be deliberate and reviewed against the origin.
[tool.ruff.lint.per-file-ignores]
"packages/pipeline-exec/src/pipeline_exec/executors/*" = ["E501", "B007"]
# discovery.py is excluded: it was rewritten here rather than extracted, so it is held to this
# repo's rules like anything else.
"packages/pipeline-exec/src/pipeline_exec/builtins/test_runner.py" = ["E501", "B007"]
"packages/pipeline-exec/src/pipeline_exec/reports/*" = ["E501", "B007"]

[tool.ruff.format]
exclude = [
    # Vendored one-way from pipeline-framework at 6ac3cde. See VENDORED.md / vendor.lock:
    # the recorded hashes are of the ORIGIN files, so `make fmt` rewriting the copies would
    # not break a gate — but it would quietly widen the diff against a reviewed import.
    "src/in_lockstep/ai/llm/**",
    "packages/pipeline-exec/src/pipeline_exec/executors/**",
    "packages/pipeline-exec/src/pipeline_exec/builtins/test_runner.py",
    "packages/pipeline-exec/src/pipeline_exec/reports/**",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# The extracted executors predate this repo's strict settings. They are type-checked, but not held to
# strict-mode rules that would require rewriting code whose behaviour we deliberately preserved.
[[tool.mypy.overrides]]
module = "pipeline_exec.executors.*"
disallow_untyped_defs = false
disallow_any_generics = false
warn_return_any = false
disallow_untyped_calls = false

# Playwright is an optional extra: API and CLI tests do not need it, and the module imports it lazily.
# Model SDKs are optional extras; the providers import them lazily inside __init__.
[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*", "google.*", "google.genai.*"]
ignore_missing_imports = true

# The vendored transport, like the extracted executors before it.
[[tool.mypy.overrides]]
module = "in_lockstep.ai.llm.*"
disallow_untyped_defs = false
disallow_any_generics = false
warn_return_any = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "playwright.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pipeline_exec.builtins.test_runner"
disallow_untyped_defs = false
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "pipeline_exec.reports.*"
disallow_untyped_defs = false
disallow_any_generics = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests", "packages/pipeline-exec/tests"]
pythonpath = ["src", "packages/pipeline-exec/src"]
# `TestScript` is a dataclass, not a test case.
python_classes = ["*Tests"]
filterwarnings = [
    "error::DeprecationWarning",
    # Every sandboxed verb runs a child process, and `asyncio.run` closes its loop as soon as the
    # coroutine returns. A subprocess transport collected after that raises "Event loop is closed"
    # from `__del__`, and pytest attributes it to whichever unrelated test triggered the
    # collection. The child has already exited and been reaped by then — the transport is closed
    # explicitly inside the loop in adapters/sandbox.py — so this is a reporting artefact rather
    # than a leak. Narrowed to the exact message so a real unraisable exception still fails.
    "ignore:Exception ignored in.*BaseSubprocessTransport:pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = false

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
# No omit list. The session executors drive a real browser, API and shell against a running
# application and cannot be meaningfully covered without one — which is exactly why they are NOT
# excluded any more. `make cov` passes --cov-config=/dev/null so nothing here applies to the gate,
# and the floor is the true figure rather than a comfortable one computed over a subset.
