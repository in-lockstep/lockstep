[project]
name = "lockstep"
version = "0.1.0"
description = "Compiles pipeline-framework definitions into GitHub Agentic Workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.scripts]
lockstep = "lockstep.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
    "pytest-cov>=7.1.0",
    "pipeline-exec",
]

# One repo, two distributions. The compiler emits `pipeline-exec` invocations as literal text, so the
# two are developed and tested together — see tests/test_contract.py. A generated pipeline repo
# installs only pipeline-exec, never the compiler.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pipeline-exec = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lockstep"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests", "packages/pipeline-exec/tests"]
pythonpath = ["src", "packages/pipeline-exec/src"]
