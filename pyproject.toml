[project]
name = "lockstep"
version = "0.1.0"
description = "Compiles pipeline-framework definitions into GitHub Agentic Workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.scripts]
lockstep = "lockstep.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
    "pytest-cov>=7.1.0",
    "pipeline-exec",
]

# One repo, two distributions. The compiler emits `pipeline-exec` invocations as literal text, so the
# two are developed and tested together — see tests/test_contract.py. A generated pipeline repo
# installs only pipeline-exec, never the compiler.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pipeline-exec = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lockstep"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Code extracted verbatim from pipeline-framework. It carries resilience behaviour earned against a
# real application, so cosmetic rules do not apply to it and — more importantly — `make fmt` must
# never silently rewrite it. Changes here should be deliberate and reviewed against the origin.
[tool.ruff.lint.per-file-ignores]
"packages/pipeline-exec/src/pipeline_exec/executors/*" = ["E501", "B007"]
"packages/pipeline-exec/src/pipeline_exec/builtins/*" = ["E501", "B007"]
"packages/pipeline-exec/src/pipeline_exec/reports/*" = ["E501", "B007"]

[tool.ruff.format]
exclude = [
    "packages/pipeline-exec/src/pipeline_exec/executors/**",
    "packages/pipeline-exec/src/pipeline_exec/builtins/**",
    "packages/pipeline-exec/src/pipeline_exec/reports/**",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# The extracted executors predate this repo's strict settings. They are type-checked, but not held to
# strict-mode rules that would require rewriting code whose behaviour we deliberately preserved.
[[tool.mypy.overrides]]
module = "pipeline_exec.executors.*"
disallow_untyped_defs = false
disallow_any_generics = false
warn_return_any = false
disallow_untyped_calls = false

# Playwright is an optional extra: API and CLI tests do not need it, and the module imports it lazily.
[[tool.mypy.overrides]]
module = "playwright.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pipeline_exec.builtins.*"
disallow_untyped_defs = false
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "pipeline_exec.reports.*"
disallow_untyped_defs = false
disallow_any_generics = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests", "packages/pipeline-exec/tests"]
pythonpath = ["src", "packages/pipeline-exec/src"]
# `TestScript` is a dataclass, not a test case.
python_classes = ["*Tests"]

[tool.coverage.run]
branch = false

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
# The session executors drive a real browser, a real API and a real shell against a running
# application; they cannot be meaningfully covered without one. They arrived from
# pipeline-framework with no tests of their own, so this is inherited debt, recorded rather than
# hidden: `make cov-all` reports the true figure, and closing it needs a fixture application.
omit = [
    "*/pipeline_exec/executors/api_session.py",
    "*/pipeline_exec/executors/browser_session.py",
    "*/pipeline_exec/executors/cli_session.py",
    "*/pipeline_exec/executors/direct_executor.py",
    "*/pipeline_exec/builtins/discovery.py",
]
