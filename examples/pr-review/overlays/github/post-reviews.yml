# Two GitHub-specific facts the spec deliberately does not model.
#
# The extension has to be installed before a `builtin:` step names one of its commands, and the job
# that posts reviews needs permission to write them. Granting that here rather than inventing a spec
# keyword keeps every write this pipeline performs visible in one file.
target: workflows/review.yml
patches:
  - op: insert-step
    at: jobs[id=diff].steps
    before: diff
    value:
      name: Install the pipeline's extensions
      id: install-extensions
      run: |
        set -euo pipefail
        python -m pip install --quiet ./extensions
        pipeline-exec list-commands --extensions-only

  - op: merge
    at: jobs[id=post]
    value:
      # The only write in the pipeline. It runs no model: the agents that wrote these reviews cannot
      # reach the pull request they are about.
      permissions:
        contents: read
        pull-requests: write
      env:
        GH_TOKEN: ${{ github.token }}
