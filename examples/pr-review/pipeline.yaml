spec: 1
name: pr-review

capabilities:
  actions: github.com/in-lockstep/lockstep/actions@actions-v1.0.0
  exec: in-lockstep-exec==0.1.0
  exec-image: ghcr.io/in-lockstep/pipeline-exec
  compiler: in-lockstep>=0.1,<1.0
  gh-aw: v0.86.2

extensions:
  builtins: [pr-diff, review-state]
  packages: ["review-ext @ file://./extensions"]

targets:
  github-agentic:
    out: .github/workflows
    fuse-script-steps: true
    default-runs-on: ubuntu-24.04
    profiles: [repo]

# What a run costs, in the currency the person approving the budget uses. Credits are measured by
# gh-aw; dollars are these rates applied to that measurement, so they are only as current as the
# table. A model with no rate here is reported as unpriced rather than as free.
otel:
  export: both
  # The collector's base URL. Both exporters read it: gh-aw's, which emits the agent spans, and the
  # meter's, which emits the run metrics. Each appends its own signal path.
  endpoint: ${OTEL_ENDPOINT}
  # The URL is resolved at run time, so neither this compiler nor gh-aw can read a hostname out of
  # it — and an agent's egress is closed. Without this the firewall drops the telemetry silently.
  host: otel.acme.internal
  headers:
    Authorization: ${OTEL_AUTHORIZATION}
  pricing:
    claude-sonnet-4-6: 0.0021
    claude-haiku-4-5: 0.0004

budgets:
  per_run_ai_credits: 400
  # Per agent workflow, per day, enforced by gh-aw before the agent starts. `/review` is one comment
  # away from being run all afternoon, and every one of those runs is inside its per-run budget.
  per_agent_daily_ai_credits: 2000
