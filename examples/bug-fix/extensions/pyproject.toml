[project]
name = "bugfix-ext"
version = "0.1.0"
description = "pipeline-exec commands for the bug-fix pipeline"
requires-python = ">=3.11"
dependencies = ["click>=8.1", "httpx>=0.27"]

# This is the whole extension mechanism. Each entry point becomes a `pipeline-exec <name>` command,
# and `<name>` is what a `builtin:` step writes in the spec — the spec never names this package.
[project.entry-points."pipeline_exec.commands"]
jira-fetch = "bugfix_ext.commands:jira_fetch"
apply-patch = "bugfix_ext.commands:apply_patch"
run-suite = "bugfix_ext.commands:run_suite"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bugfix_ext"]
