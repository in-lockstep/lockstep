name: Set up the target repository
description: >-
  Check out the application being fixed and install its toolchain.

  This is a composite action rather than a script step because it needs other actions —
  `actions/checkout` for a second repository and a language setup action — and a script cannot call
  those. That is the line: work that is only shell belongs in a builtin, where it can be unit tested;
  work that must compose other actions belongs here.

inputs:
  repository:
    description: The application repository, as owner/name.
    required: true
  ref:
    description: Branch or tag to check out.
    required: false
    default: main
  path:
    description: Where to place it inside the workspace.
    required: false
    default: target
  token:
    description: Token with read access to it. Use a PAT for a private repository.
    required: false
    default: ""
  python-version:
    description: Toolchain version to install.
    required: false
    default: "3.12"

outputs:
  path:
    description: Where the application was checked out.
    value: ${{ inputs.path }}
  sha:
    description: The commit that was checked out, so a fix can name what it was written against.
    value: ${{ steps.record.outputs.sha }}

runs:
  using: composite
  steps:
    - name: Check out the application
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        path: ${{ inputs.path }}
        token: ${{ inputs.token || github.token }}
        fetch-depth: 0        # the analysing agent reads history to find when a bug arrived

    - name: Install its toolchain
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install its dependencies
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        set -euo pipefail
        if [ -f pyproject.toml ]; then
          python -m pip install --quiet -e ".[dev]" 2>/dev/null || python -m pip install --quiet -e .
        elif [ -f requirements.txt ]; then
          python -m pip install --quiet -r requirements.txt
        else
          echo "no dependency manifest found; continuing"
        fi

    - name: Record the commit
      id: record
      shell: bash
      working-directory: ${{ inputs.path }}
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
