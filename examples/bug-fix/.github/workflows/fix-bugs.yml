      run: pipeline-exec scan-input --input=outputs/validated.json --input=outputs/patches/combined.patch --input=outputs/feedback.json --mode=warn --report=outputs/scan/review-the-fixes.json
    - id: save-workspace
      if: ${{ always() }}
      uses: in-lockstep/lockstep/actions/save@45f5a996ffbe35ba03ee18d540de6dcd3f9c6011  # actions-v0.1.1
  review-the-fixes:
    needs:
    - command-gate
    - apply
    - scan-review-the-fixes
    if: ${{ !failure() && !cancelled() && needs.command-gate.outputs.authorized == 'true' }}
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/aw-fix-reviewer.lock.yml
    with:
      input_path: outputs/validated.json
      output_path: outputs/review.json
      context_files: outputs/patches/combined.patch,outputs/feedback.json
  assemble-what-passed-review:
    needs:
    - command-gate
    - review-the-fixes
    if: ${{ !failure() && !cancelled() && needs.command-gate.outputs.authorized == 'true' && inputs.dry_run != true }}
    permissions:
      contents: read
      actions: read
    environment: production
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/in-lockstep/pipeline-exec@sha256:70de3f808f16cf308864107c0659c08245dee1910aab50c38c20cdb684fc7253
      options: --cap-drop=ALL --cap-add=DAC_OVERRIDE --security-opt=no-new-privileges
    env:
      PRODUCTION_JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
      PROFILE_JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
      PRODUCTION_JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      PROFILE_JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      PRODUCTION_TARGET_REPO: ${{ vars.TARGET_REPO }}
      PROFILE_TARGET_REPO: ${{ vars.TARGET_REPO }}
      PRODUCTION_TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
      PROFILE_TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
    - uses: in-lockstep/lockstep/actions/restore@45f5a996ffbe35ba03ee18d540de6dcd3f9c6011  # actions-v0.1.1
    - id: cache-assemble-what-passed-review
      uses: in-lockstep/lockstep/actions/step-cache@45f5a996ffbe35ba03ee18d540de6dcd3f9c6011  # actions-v0.1.1
      with:
        step: assemble-what-passed-review
        key-prefix: ls-v1-bug-fix-fix-bugs-assemble-what-passed-review-6f770952
        key-inputs: |
          .pipeline/step-defs/fix-bugs.assemble-what-passed-review.json
          outputs/patches
          outputs/review.json
          scripts/assemble-fixes.py
        outputs: |
          outputs/fixes
        force: ${{ inputs.force }}
        force-steps: ${{ inputs.force_steps }}
    - name: Assemble what passed review
      id: assemble-what-passed-review
      if: ${{ steps.cache-assemble-what-passed-review.outputs.hit != 'true' }}
      run: uv run python3 scripts/assemble-fixes.py --review=outputs/review.json --patches=outputs/patches --output=outputs/fixes
    - name: Publish assemble-what-passed-review outputs
      if: ${{ steps.cache-assemble-what-passed-review.outputs.hit != 'true' }}
      uses: in-lockstep/lockstep/actions/step-cache/save@45f5a996ffbe35ba03ee18d540de6dcd3f9c6011  # actions-v0.1.1
      with:
        step: assemble-what-passed-review
        outputs: |
          outputs/fixes
        key: ${{ steps.cache-assemble-what-passed-review.outputs.key }}
    - id: save-workspace
      if: ${{ always() }}
      uses: in-lockstep/lockstep/actions/save@45f5a996ffbe35ba03ee18d540de6dcd3f9c6011  # actions-v0.1.1
  propose-generated-artifacts:
    needs:
    - command-gate
    - assemble-what-passed-review
    if: ${{ needs.command-gate.outputs.authorized == 'true' && !cancelled() }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/in-lockstep/pipeline-exec@sha256:70de3f808f16cf308864107c0659c08245dee1910aab50c38c20cdb684fc7253
      options: --cap-drop=ALL --cap-add=DAC_OVERRIDE --security-opt=no-new-privileges
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
    - uses: in-lockstep/lockstep/actions/restore@45f5a996ffbe35ba03ee18d540de6dcd3f9c6011  # actions-v0.1.1
    - name: Propose the generated artifacts
      id: propose
      uses: in-lockstep/lockstep/actions/propose-pr@45f5a996ffbe35ba03ee18d540de6dcd3f9c6011  # actions-v0.1.1
      with:
        source: outputs/fixes
        destination: proposed-fixes
        branch: pipeline/bug-fixes
        title: Proposed bug fixes
        labels: pipeline,bug-fix,needs-review
