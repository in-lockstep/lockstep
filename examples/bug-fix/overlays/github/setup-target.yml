# The application being fixed is a different repository, so every job that reads or tests it must
# check it out first. The spec has no keyword for "check out a second repository" — deliberately,
# since that is a GitHub-specific concern — so it arrives as an overlay.
#
# Anchors key on step `id:`, which is why the command gives its steps explicit ids: renaming a step's
# label later will not silently detach these patches.
target: workflows/fix-bugs.yml
patches:
  - op: insert-step
    at: jobs[id=fetch-bugs].steps
    after: fetch-bugs
    value:
      name: Set up the application being fixed
      id: setup-target
      uses: ./extensions/actions/setup-target
      with:
        repository: ${{ vars.TARGET_REPO }}
        token: ${{ secrets.TARGET_REPO_TOKEN }}
        path: outputs/target
        python-version: "3.12"

  # The extension's commands have to exist before a builtin step names one.
  - op: insert-step
    at: jobs[id=fetch-bugs].steps
    before: fetch-bugs
    value:
      name: Install the pipeline's extensions
      id: install-extensions
      run: |
        set -euo pipefail
        python -m pip install --quiet ./extensions
        pipeline-exec list-commands --extensions-only
