spec: 1
name: implement-issue

capabilities:
  actions: github.com/in-lockstep/lockstep/actions@actions-v0.1.1
  exec: in-lockstep-exec==0.1.0
  exec-image: ghcr.io/in-lockstep/pipeline-exec
  compiler: in-lockstep>=0.1,<1.0
  gh-aw: v0.86.2

extensions:
  builtins: [issue-fetch, await-checks]
  packages: ["issue-ext @ file://./extensions"]

targets:
  github-agentic:
    out: .github/workflows
    fuse-script-steps: true
    default-runs-on: ubuntu-24.04
    profiles: [main]

budgets:
  per_run_ai_credits: 700
