[project]
name = "issue-ext"
version = "0.1.0"
description = "pipeline-exec commands for the implement-issue pipeline"
requires-python = ">=3.11"
dependencies = ["click>=8.1"]

[project.entry-points."pipeline_exec.commands"]
issue-fetch = "issue_ext.commands:issue_fetch"
await-checks = "issue_ext.commands:await_checks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issue_ext"]
