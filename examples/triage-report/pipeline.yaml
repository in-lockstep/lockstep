spec: 1
name: triage-report

capabilities:
  actions: github.com/pipeline-fw/pipeline-actions@v1.0.0
  exec: pipeline-exec==0.1.0
  exec-image: ghcr.io/pipeline-fw/pipeline-exec
  compiler: lockstep>=0.1,<1.0
  gh-aw: v0.34.0

extensions:
  builtins: [jql-search]
  packages: ["triage-ext @ file://./extensions"]

targets:
  github-agentic:
    out: .github/workflows
    fuse-script-steps: true
    default-runs-on: ubuntu-24.04
    profiles: [tracker]

budgets:
  per_run_ai_credits: 250
