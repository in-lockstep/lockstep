spec: 1
name: triage-report

capabilities:
  actions: github.com/in-lockstep/lockstep/actions@actions-v0.1.0
  exec: in-lockstep-exec==0.1.0
  exec-image: ghcr.io/in-lockstep/pipeline-exec
  compiler: in-lockstep>=0.1,<1.0
  gh-aw: v0.86.2

extensions:
  builtins: [jql-search]
  packages: ["triage-ext @ file://./extensions"]

targets:
  github-agentic:
    out: .github/workflows
    fuse-script-steps: true
    default-runs-on: ubuntu-24.04
    profiles: [tracker]

budgets:
  per_run_ai_credits: 250
